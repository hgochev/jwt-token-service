apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "jwt-token-service.fullname" . }}-auth-delegator
  labels:
    {{- include "jwt-token-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "jwt-token-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
